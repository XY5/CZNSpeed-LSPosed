plugins {
    id 'com.android.application'
}

android {
    namespace 'com.czn.mod'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.czn.mod"
        minSdk 24
        targetSdk 34

        // semver: versionCode is derived from MAJOR.MINOR.PATCH so the two
        // can never drift apart (MINOR/PATCH are capped at 99).
        def vMajor = 1, vMinor = 0, vPatch = 1
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName "${vMajor}.${vMinor}.${vPatch}"

        // native core is arm64-only (uses aarch64 GOT relocation types)
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // provided by the framework at runtime; never bundled
    compileOnly 'de.robv.android.xposed:api:82'
}
