pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        // Xposed API artifacts (api.xposed.info) also host in mavenCentral-adjacent repos;
        // add api.xposed.info if compileOnly resolution fails
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://api.xposed.info/' }
    }
}
rootProject.name = "CZNSpeed-LSPosed"
include ':app'
